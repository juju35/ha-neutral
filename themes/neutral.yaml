Neutral:
  # ==== Shape (light and dark) ====
  ha-card-border-radius: "14px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  mdc-shape-medium: "14px"
  ha-dialog-border-radius: "16px"

  # ==== Modes ====
  modes:
    light:
      # Accent
      primary-color: "#2360e8"
      accent-color: "#2360e8"
      rgb-primary-color: "35, 96, 232"
      rgb-accent-color: "35, 96, 232"

      # Page and surfaces: flat neutral grays
      primary-background-color: "#e9ecef"
      lovelace-background: "#e9ecef"
      secondary-background-color: "#f4f5f7"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-card-border-color: "#e1e4e8"
      divider-color: "#e1e4e8"
      ha-dialog-surface-background: "#ffffff"
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.32)"

      # Text and icons
      primary-text-color: "#1c1e21"
      secondary-text-color: "#6b7078"
      text-primary-color: "#ffffff"
      rgb-primary-text-color: "28, 30, 33"
      rgb-text-primary-color: "255, 255, 255"
      disabled-text-color: "#a3a8af"
      state-icon-color: "#6b7078"
      state-icon-active-color: "#945f09"

      # App header and side panel
      app-header-background-color: "#f7f8f9"
      app-header-text-color: "#1c1e21"
      app-header-border-bottom: "1px solid #e1e4e8"
      sidebar-background-color: "#f7f8f9"
      sidebar-text-color: "#1c1e21"
      sidebar-icon-color: "#6b7078"
      sidebar-selected-text-color: "#2360e8"
      sidebar-selected-icon-color: "#2360e8"

      # Status palette of the ha-* cards (green OK, amber active, blue open,
      # cyan cold, purple media, red alert, gray idle). State colors derive from these.
      # Every status color reaches >= 4.5:1 as text on the card and the inner tiles
      # (same palette as ha-liquid-glass, checked by the Validate workflow).
      green-color: "#1a7a3d"
      amber-color: "#945f09"
      orange-color: "#a95204"
      yellow-color: "#826705"
      blue-color: "#2360e8"
      light-blue-color: "#176db5"
      cyan-color: "#077489"
      teal-color: "#05786a"
      purple-color: "#7c4dcc"
      deep-purple-color: "#6741b8"
      red-color: "#c53030"
      grey-color: "#666b73"
      success-color: "#1a7a3d"
      warning-color: "#945f09"
      error-color: "#c53030"
      info-color: "#2360e8"
      rgb-green-color: "26, 122, 61"
      rgb-amber-color: "148, 95, 9"
      rgb-orange-color: "169, 82, 4"
      rgb-yellow-color: "130, 103, 5"
      rgb-blue-color: "35, 96, 232"
      rgb-light-blue-color: "23, 109, 181"
      rgb-cyan-color: "7, 116, 137"
      rgb-teal-color: "5, 120, 106"
      rgb-purple-color: "124, 77, 204"
      rgb-deep-purple-color: "103, 65, 184"
      rgb-red-color: "197, 48, 48"
      rgb-grey-color: "102, 107, 115"
      rgb-success-color: "26, 122, 61"
      rgb-warning-color: "148, 95, 9"
      rgb-error-color: "197, 48, 48"
      rgb-info-color: "35, 96, 232"

    dark:
      # Accent
      primary-color: "#86baff"
      accent-color: "#86baff"
      rgb-primary-color: "134, 186, 255"
      rgb-accent-color: "134, 186, 255"

      # Page and surfaces: flat neutral grays
      primary-background-color: "#111315"
      lovelace-background: "#111315"
      secondary-background-color: "#25292e"
      card-background-color: "#1c1f23"
      ha-card-background: "#1c1f23"
      ha-card-border-color: "#2c3035"
      divider-color: "#2c3035"
      ha-dialog-surface-background: "#1c1f23"
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.6)"

      # Text and icons
      primary-text-color: "#e8eaed"
      secondary-text-color: "#9aa0a6"
      text-primary-color: "#111315"
      rgb-primary-text-color: "232, 234, 237"
      rgb-text-primary-color: "17, 19, 21"
      disabled-text-color: "#5f656c"
      state-icon-color: "#9aa0a6"
      state-icon-active-color: "#f2b84b"

      # App header and side panel
      app-header-background-color: "#1a1d20"
      app-header-text-color: "#e8eaed"
      app-header-border-bottom: "1px solid #2c3035"
      sidebar-background-color: "#1a1d20"
      sidebar-text-color: "#e8eaed"
      sidebar-icon-color: "#9aa0a6"
      sidebar-selected-text-color: "#86baff"
      sidebar-selected-icon-color: "#86baff"

      # Status palette of the ha-* cards, brightened for dark surfaces:
      # >= 4.5:1 as text on the card and the inner tiles (same palette as ha-liquid-glass).
      green-color: "#5fd08a"
      amber-color: "#f2b84b"
      orange-color: "#ffa05a"
      yellow-color: "#e8cf5a"
      blue-color: "#86baff"
      light-blue-color: "#8bd0ff"
      cyan-color: "#5cc8e0"
      teal-color: "#4fd1bd"
      purple-color: "#d0bfff"
      deep-purple-color: "#bdabff"
      red-color: "#ff9c98"
      grey-color: "#b2b8be"
      success-color: "#5fd08a"
      warning-color: "#f2b84b"
      error-color: "#ff9c98"
      info-color: "#86baff"
      rgb-green-color: "95, 208, 138"
      rgb-amber-color: "242, 184, 75"
      rgb-orange-color: "255, 160, 90"
      rgb-yellow-color: "232, 207, 90"
      rgb-blue-color: "134, 186, 255"
      rgb-light-blue-color: "139, 208, 255"
      rgb-cyan-color: "92, 200, 224"
      rgb-teal-color: "79, 209, 189"
      rgb-purple-color: "208, 191, 255"
      rgb-deep-purple-color: "189, 171, 255"
      rgb-red-color: "255, 156, 152"
      rgb-grey-color: "178, 184, 190"
      rgb-success-color: "95, 208, 138"
      rgb-warning-color: "242, 184, 75"
      rgb-error-color: "255, 156, 152"
      rgb-info-color: "134, 186, 255"
