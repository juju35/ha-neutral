default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
  - repo: local
    hooks:
      - id: screenshots-used
        name: every capture shown in the README, and only those
        entry: python scripts/check_screenshots.py
        language: python
        pass_filenames: false
        always_run: true
